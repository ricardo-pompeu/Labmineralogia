<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabInfra - UFPA</title>

    <link rel="stylesheet" href="../Pratica/etapas.css">
    <link rel="icon" href="src/imagem/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="src/imagem/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>

    <ul class="navigator">
        <li class="nav1">
            <a id="openSidebar" href="../Inicial/index.html">
                <i data-lucide="chevron-left"></i>
            </a>
        </li>
        <li class="nav2"> Inteligência artificial </li>
    </ul>

    <section class="inicio">
        <div>
            <h4>Utilize a IA para auxiliar na identificação mineralógica.</h4>

            <div class="div-chat">
                <input id="descricaoMineral"
                       class="card-box-chat"
                       type="text"
                       placeholder="Descreva um mineral...">
                <button class="button-sugest" onclick="identificarMineral()">Enviar</button>
            </div>
        </div>

        <div>
            <div id="resposta"></div>
        </div>
    </section>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>

    <script>
        const API_KEY = "AIzaSyDnCDDXxRTMnG_5eV3O3J-acD74gctlMF0";

        async function identificarMineral() {
            const descricao = document.getElementById("descricaoMineral").value;
            const respostaDiv = document.getElementById("resposta");

            if (!descricao.trim()) {
                respostaDiv.innerText = "Digite uma descrição do mineral.";
                return;
            }

            respostaDiv.innerText = "Analisando...";

            try {
                const response = await fetch(
                    "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + API_KEY,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `
Você é um geólogo especialista em mineralogia.
Identifique o mineral com base na descrição abaixo.

Descrição:
${descricao}

Responda no formato:
Nome do mineral:
Composição química:
Dureza:
Ambiente geológico:
`
                                }]
                            }]
                        })
                    }
                );

                const data = await response.json();

                const texto =
                    data.candidates?.[0]?.content?.parts?.[0]?.text ||
                    "Não foi possível identificar o mineral.";

                respostaDiv.innerText = texto;

            } catch (erro) {
                respostaDiv.innerText = "Erro ao conectar com a IA.";
                console.error(erro);
            }
        }
    </script>

    <script src="../Inicial/scripts.js" defer></script>
</body>

</html>
