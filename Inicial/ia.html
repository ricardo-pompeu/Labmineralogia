<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabInfra - UFPA</title>

    <link rel="stylesheet" href="../Pratica/etapas.css">
    <link rel="icon" href="src/imagem/favicon.ico">
</head>

<body>

<ul class="navigator">
    <li class="nav1">
        <a href="../Inicial/index.html">
            <i data-lucide="chevron-left"></i>
        </a>
    </li>
    <li class="nav2">Inteligência artificial</li>
</ul>

<section class="inicio">
    <div>
        <h4>Utilize a IA para auxiliar na identificação mineralógica.</h4>

        <div class="div-chat">
            <input id="descricaoMineral"
                   class="card-box-chat"
                   type="text"
                   placeholder="Descreva um mineral...">

            <button onclick="identificarMineral()">Enviar</button>
        </div>
    </div>

    <div id="resposta"></div>
</section>

<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>

<script>
async function identificarMineral() {
    const descricao = document.getElementById("descricaoMineral").value;
    const respostaDiv = document.getElementById("resposta");

    if (!descricao.trim()) {
        respostaDiv.innerText = "Digite uma descrição do mineral.";
        return;
    }

    respostaDiv.innerText = "Analisando...";

    try {
        const response = await fetch("/api/identificar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ descricao })
        });

        const data = await response.json();
        respostaDiv.innerText = data.resposta;

    } catch (erro) {
        respostaDiv.innerText = "Erro ao conectar com a IA.";
        console.error(erro);
    }
}
</script>

</body>
</html>
